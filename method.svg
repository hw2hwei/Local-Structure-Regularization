<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Local Structure Regularization for semantic segmentation</title>
  <desc id="desc">Predicted probabilities and smoothed one-hot labels are converted to local structure tensors. Ground-truth boundary support and anisotropy weighting supervise orientation and magnitude terms, which are combined with the task loss.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#46545e"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18252d; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; fill: #46545e; }
      .box { stroke-width: 2; rx: 12; }
      .arrow { stroke: #46545e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="690" fill="#f5f7f4"/>
  <text class="title" x="48" y="52">Local Structure Regularization (LS)</text>
  <text class="small" x="48" y="82">Boundary-aware orientation and transition-strength supervision on segmentation probability fields</text>

  <rect class="box" x="48" y="132" width="205" height="90" fill="#e4edf2" stroke="#66889b"/>
  <text class="label" x="150" y="168" text-anchor="middle">Segmentation logits</text>
  <text class="small" x="150" y="197" text-anchor="middle">z [B, C, H, W]</text>
  <path class="arrow" d="M253 177 H303"/>

  <rect class="box" x="310" y="132" width="205" height="90" fill="#d8ece7" stroke="#438a79"/>
  <text class="label" x="412" y="168" text-anchor="middle">Softmax field</text>
  <text class="small" x="412" y="197" text-anchor="middle">p = softmax(z)</text>
  <path class="arrow" d="M515 177 H568"/>

  <rect class="box" x="575" y="132" width="260" height="90" fill="#fff0d8" stroke="#c89443"/>
  <text class="label" x="705" y="168" text-anchor="middle">Local structure tensor</text>
  <text class="small" x="705" y="197" text-anchor="middle">Sobel gradients → J(p) → o(p), r(p)</text>

  <rect class="box" x="48" y="320" width="205" height="90" fill="#e4edf2" stroke="#66889b"/>
  <text class="label" x="150" y="356" text-anchor="middle">Ground-truth labels</text>
  <text class="small" x="150" y="385" text-anchor="middle">y → one-hot Y</text>
  <path class="arrow" d="M253 365 H303"/>

  <rect class="box" x="310" y="320" width="205" height="90" fill="#d8ece7" stroke="#438a79"/>
  <text class="label" x="412" y="356" text-anchor="middle">GT target fields</text>
  <text class="small" x="412" y="385" text-anchor="middle">smooth Y; extract boundary B</text>
  <path class="arrow" d="M515 365 H568"/>

  <rect class="box" x="575" y="300" width="260" height="130" fill="#fff0d8" stroke="#c89443"/>
  <text class="label" x="705" y="339" text-anchor="middle">GT structure tensor</text>
  <text class="small" x="705" y="370" text-anchor="middle">J(Y) → o(Y), r(Y)</text>
  <text class="tiny" x="705" y="400" text-anchor="middle">w = B × normalized r(Y)</text>

  <path class="arrow" d="M835 177 C875 177 865 275 900 295"/>
  <path class="arrow" d="M835 365 C870 365 868 350 900 345"/>
  <rect class="box" x="906" y="266" width="245" height="145" fill="#f7e2dd" stroke="#bd6f5c"/>
  <text class="label" x="1028" y="300" text-anchor="middle">Boundary comparison</text>
  <text class="small" x="1028" y="337" text-anchor="middle">LSO: 1 − ⟨o(p), o(Y)⟩</text>
  <text class="small" x="1028" y="370" text-anchor="middle">LSM: |r̂(p) − r̂(Y)|</text>
  <text class="tiny" x="1028" y="395" text-anchor="middle">Both reduced with GT weight w</text>

  <path class="arrow" d="M1028 411 V475"/>
  <rect class="box" x="756" y="486" width="395" height="112" fill="#e3e9d8" stroke="#788f52"/>
  <text class="label" x="953" y="524" text-anchor="middle">Combined training objective</text>
  <text class="small" x="953" y="558" text-anchor="middle">L = Ltask + λo · LSO + λm · LSM</text>
  <text class="tiny" x="953" y="582" text-anchor="middle">Backpropagate through predicted probability field p</text>

  <rect x="48" y="486" width="610" height="112" rx="12" fill="#ffffff" stroke="#cbd3d1" stroke-width="1.5"/>
  <text class="small" x="72" y="522">LSO (orientation): aligns local boundary directions.</text>
  <text class="small" x="72" y="553">LSM (magnitude): matches normalized transition strength.</text>
  <text class="tiny" x="72" y="580">GT-derived support prevents unrelated interior pixels from dominating.</text>
</svg>